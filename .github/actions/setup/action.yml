name: setup
description: Install Bun and the workspace dependencies.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - run: bun ci
      shell: bash
      env:
        BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/botrepel-bun-cache
