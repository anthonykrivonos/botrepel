      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8f93"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="#0a0a0c"/>
  <path d="M 320 312 C 570 312, 570 312, 812 312" fill="none" stroke="#8a8f93" stroke-width="2" marker-end="url(#arrow)"/><path d="M 720 152 C 770 152, 770 312, 812 312" fill="none" stroke="#8a8f93" stroke-width="2" marker-end="url(#arrow)"/><path d="M 720 492 C 770 492, 770 312, 812 312" fill="none" stroke="#8a8f93" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
        <rect x="40" y="240" width="280" height="144" rx="12" fill="#111113" stroke="#ff9592" stroke-width="2"/>
        <text x="60" y="280" fill="#fcfcfd" font-size="22" font-family="Inter, ui-sans-serif, sans-serif">HTTP library</text>
        <text x="60" y="318" fill="#b8bdc2" font-size="16" font-family="Inter, ui-sans-serif, sans-serif">No JavaScript.</text><text x="60" y="344" fill="#b8bdc2" font-size="16" font-family="Inter, ui-sans-serif, sans-serif">Fails a script challenge.</text>
      </g><g>
        <rect x="400" y="80" width="320" height="144" rx="12" fill="#111113" stroke="#ffca16" stroke-width="2"/>
        <text x="420" y="120" fill="#fcfcfd" font-size="22" font-family="Inter, ui-sans-serif, sans-serif">Headless browser</text>
        <text x="420" y="158" fill="#b8bdc2" font-size="16" font-family="Inter, ui-sans-serif, sans-serif">Runs the page script.</text><text x="420" y="184" fill="#b8bdc2" font-size="16" font-family="Inter, ui-sans-serif, sans-serif">Can pass proof of work.</text>
      </g><g>
        <rect x="400" y="420" width="320" height="144" rx="12" fill="#111113" stroke="#46fea5" stroke-width="2"/>
        <text x="420" y="460" fill="#fcfcfd" font-size="22" font-family="Inter, ui-sans-serif, sans-serif">Person in a browser</text>
        <text x="420" y="498" fill="#b8bdc2" font-size="16" font-family="Inter, ui-sans-serif, sans-serif">Same JavaScript engine.</text><text x="420" y="524" fill="#b8bdc2" font-size="16" font-family="Inter, ui-sans-serif, sans-serif">Signals can look unusual.</text>
      </g><g>
        <rect x="820" y="240" width="330" height="144" rx="12" fill="#111113" stroke="#70b8ff" stroke-width="2"/>
        <text x="840" y="280" fill="#fcfcfd" font-size="22" font-family="Inter, ui-sans-serif, sans-serif">Your server</text>
        <text x="840" y="318" fill="#b8bdc2" font-size="16" font-family="Inter, ui-sans-serif, sans-serif">siteverify decides.</text><text x="840" y="344" fill="#b8bdc2" font-size="16" font-family="Inter, ui-sans-serif, sans-serif">A flag is only a clue.</text>
      </g>
</svg>
